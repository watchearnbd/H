name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: কোড চেকআউট করা হচ্ছে
        uses: actions/checkout@v4

      - name: রিপোর ফাইল লিস্ট দেখা হচ্ছে (ডিবাগের জন্য)
        run: ls -la

      # রিপোতে যেই নামেই zip ফাইল থাকুক না কেন, সেটা নিজে খুঁজে বের করে আনজিপ করা হচ্ছে
      - name: Zip আনজিপ করা হচ্ছে
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "কোনো .zip ফাইল রিপোর রুটে পাওয়া যায়নি!"
            exit 1
          fi
          echo "পাওয়া গেছে: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted
          echo "----- এক্সট্র্যাক্ট হওয়া কনটেন্ট -----"
          find extracted -maxdepth 3

      - name: প্রজেক্ট ফোল্ডার খুঁজে বের করা হচ্ছে
        id: findproj
        run: |
          PROJDIR=$(find extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJDIR" ]; then
            echo "settings.gradle.kts খুঁজে পাওয়া যায়নি!"
            exit 1
          fi
          echo "প্রজেক্ট ফোল্ডার: $PROJDIR"
          echo "projdir=$PROJDIR" >> "$GITHUB_OUTPUT"

      - name: JDK 17 সেটআপ করা হচ্ছে
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # AGP 9.1.1 এর জন্য ন্যূনতম Gradle 9.3.1 লাগে, তাই ভার্সন হার্ডকোড না করে
      # সবসময় সর্বশেষ স্থিতিশীল Gradle ব্যবহার করা হচ্ছে
      - name: Gradle সেটআপ করা হচ্ছে
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Debug keystore জেনারেট করা হচ্ছে
        working-directory: ${{ steps.findproj.outputs.projdir }}
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Debug APK বিল্ড করা হচ্ছে
        working-directory: ${{ steps.findproj.outputs.projdir }}
        run: gradle assembleDebug --stacktrace
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: APK আপলোড করা হচ্ছে (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voice-generator-debug-apk
          path: ${{ steps.findproj.outputs.projdir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
