name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: কোড চেকআউট করা হচ্ছে
        uses: actions/checkout@v4

      # রিপোতে zip ফাইলটাই সরাসরি আপলোড করা আছে, তাই এখানে সেটা আনজিপ করে
      # প্রজেক্ট ফোল্ডার বের করে আনা হচ্ছে
      - name: Zip আনজিপ করা হচ্ছে
        run: |
          unzip -o "voice-generator-github-ready.zip" -d extracted
          echo "----- এক্সট্র্যাক্ট হওয়া কনটেন্ট -----"
          find extracted -maxdepth 3

      - name: JDK 17 সেটআপ করা হচ্ছে
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle সেটআপ করা হচ্ছে
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Debug keystore জেনারেট করা হচ্ছে
        working-directory: extracted/kantho_project
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Debug APK বিল্ড করা হচ্ছে
        working-directory: extracted/kantho_project
        run: gradle assembleDebug --stacktrace
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: APK আপলোড করা হচ্ছে (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voice-generator-debug-apk
          path: extracted/kantho_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
